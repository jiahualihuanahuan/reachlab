services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      ROM_PATH: /roms/yellow.gbc
    volumes:
      - ./roms:/roms:ro
    restart: unless-stopped

  trainer:
    profiles: ["gpu"]
    build: ./trainer
    ports:
      - "8010:8010"
    environment:
      PORT: "8010"
      CHECKPOINT: /checkpoints/policy.pt
      VRAM_BUDGET_GB: "2.5"
    volumes:
      - trainer:/checkpoints
    gpus: all
    restart: unless-stopped

volumes:
  trainer:
